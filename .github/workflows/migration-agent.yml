name: Migration Agent

on:
  workflow_dispatch:
    inputs:
      branch_name:
        description: "Migration Branch"
        required: true
        default: "java17-migration"

  push:
    branches:
      - java17-migration

permissions:
  contents: write
  pull-requests: write

jobs:
  migrate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade Java Version
        run: |
          sed -i 's/<java.version>11<\/java.version>/<java.version>17<\/java.version>/g' pom.xml

      - name: Upgrade Maven Compiler Plugin
        run: |
          sed -i 's/<source>11<\/source>/<source>17<\/source>/g' pom.xml || true
          sed -i 's/<target>11<\/target>/<target>17<\/target>/g' pom.xml || true

      - name: Upgrade Spring Boot Version
        run: |
          sed -i 's/<version>2.7.18<\/version>/<version>3.3.13<\/version>/g' pom.xml

      - name: Migrate Jakarta Imports
        run: |
          find src/main/java -name "*.java" -type f \
          -exec sed -i 's/import javax\.persistence/import jakarta.persistence/g' {} \;

          find src/main/java -name "*.java" -type f \
          -exec sed -i 's/import javax\.validation/import jakarta.validation/g' {} \;

          find src/main/java -name "*.java" -type f \
          -exec sed -i 's/import javax\.servlet/import jakarta.servlet/g' {} \;

          find src/main/java -name "*.java" -type f \
          -exec sed -i 's/import javax\.annotation/import jakarta.annotation/g' {} \;

      - name: Verify Changes
        run: |
          grep -n "java.version" pom.xml || true
          grep -n "spring-boot-starter-parent" -A 5 pom.xml || true

      - name: Create Output Directory
        run: |
          mkdir -p security-governance/outputs

      - name: Maven Compile
        id: build
        continue-on-error: true
        run: |
          mvn clean compile -DskipTests \
          > security-governance/outputs/build-errors.txt 2>&1

      - name: Run POM Analysis
        run: |
          python security-governance/scripts/analyze_pom.py

      - name: Run Source Analysis
        run: |
          python security-governance/scripts/analyze_source.py

      - name: Generate Migration Plan
        run: |
          python security-governance/scripts/generate_plan.py

      - name: Generate Agent Task
        run: |
          python security-governance/scripts/generate_agent_task.py

      - name: Upload Migration Analysis
        uses: actions/upload-artifact@v4
        with:
          name: migration-agent-analysis
          path: security-governance/outputs/

      - name: Maven Test
        if: steps.build.outcome == 'success'
        run: |
          mvn test

      - name: Configure Git
        if: steps.build.outcome == 'success'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Commit Changes
        if: steps.build.outcome == 'success'
        run: |
          git add .
          git commit -m "Migration: Java 17 and Spring Boot 3.3.13" || true

      - name: Push Branch
        if: steps.build.outcome == 'success'
        run: |
          git push origin HEAD

      - name: Migration Failed
        if: steps.build.outcome == 'failure'
        run: |
          echo "Compilation failed."
          echo "Check build-errors.txt and agent-task.md in uploaded artifacts."

      - name: Create Pull Request
        if: steps.build.outcome == 'success'
        uses: peter-evans/create-pull-request@v7
        with:
          title: "[Migration] Java 17 and Spring Boot 3.3.13"
          body: |
            Automated migration completed.

            Changes applied:
            - Java 11 → 17
            - Maven compiler updated
            - Spring Boot 2.7.18 → 3.3.13
            - javax.* → jakarta.*
            - Maven compile successful
            - Maven tests successful