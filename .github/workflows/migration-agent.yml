name: Migration Agent
on:
  workflow_dispatch:
    inputs:
      target_java:
        description: "Target Java Version"
        required: true
        default: "17"

      target_spring_boot:
        description: "Target Spring Boot Version"
        required: true
        default: "3.3.13"

permissions:
  contents: write
  pull-requests: write

jobs:
  migrate:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Create Migration Branch
        run: |
          BRANCH_NAME=migration_java17_springboot3

          git checkout master
          git checkout -b $BRANCH_NAME

          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV

      - name: Read Current Versions
        run: |
          echo "===== JAVA VERSION ====="
          grep -n "java.version" pom.xml || true

          echo "===== SPRING BOOT VERSION ====="
          grep -A 5 -B 1 "spring-boot-starter-parent" pom.xml || true

      - name: Upgrade Java Version
        run: |
          sed -i 's/<java.version>11<\/java.version>/<java.version>${{ inputs.target_java }}<\/java.version>/g' pom.xml

      - name: Upgrade Maven Compiler Plugin
        run: |
          sed -i 's/<source>11<\/source>/<source>${{ inputs.target_java }}<\/source>/g' pom.xml
          sed -i 's/<target>11<\/target>/<target>${{ inputs.target_java }}<\/target>/g' pom.xml

      - name: Upgrade Spring Boot Version
        run: |
          sed -i 's/<version>2.7.18<\/version>/<version>${{ inputs.target_spring_boot }}<\/version>/g' pom.xml

      - name: Verify Updated pom.xml
        run: |
          grep -n "java.version" pom.xml

          echo ""
          grep -A 5 -B 1 "spring-boot-starter-parent" pom.xml

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.target_java }}
          cache: maven

      - name: Maven Compile
        run: |
          mvn clean compile -DskipTests

      - name: Maven Test
        run: |
          mvn test

      - name: Commit Changes
        run: |
          git add .

          git commit -m "Migration Java ${{ inputs.target_java }} and Spring Boot ${{ inputs.target_spring_boot }}" || true

      - name: Push Branch
        run: |
          git push origin $BRANCH_NAME

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: ${{ env.BRANCH_NAME }}
          title: "[Migration] Java ${{ inputs.target_java }} and Spring Boot ${{ inputs.target_spring_boot }}"
          body: |
            Automated migration:

            - Java upgraded
            - Maven compiler updated
            - Spring Boot upgraded
            - Maven compile successful
            - Maven tests successful