name: SecureFix Apply Approved

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - securefix-poc

permissions:
  contents: write
  pull-requests: write

jobs:
  approval-gate:
    runs-on: ubuntu-latest

    environment:
      name: security-fix-approval

    steps:
      - name: Approval received
        run: echo "Migration approved"

  apply-migration:
    needs: approval-gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create output directory
        run: |
          mkdir -p security-governance/outputs

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Show current Java version
        run: |
          grep -n "java.version" pom.xml || true

      - name: Find javax imports
        run: |
          grep -R "javax\." src/main/java || true

      - name: Upgrade Java 11 to 17
        run: |
          sed -i 's/<java.version>11<\/java.version>/<java.version>17<\/java.version>/g' pom.xml

      - name: Upgrade Maven Compiler Plugin to Java 17
        run: |
          sed -i 's/<source>11<\/source>/<source>17<\/source>/g' pom.xml
          sed -i 's/<target>11<\/target>/<target>17<\/target>/g' pom.xml

      - name: Verify Migration Changes
        run: |
          echo "==== Java Version ===="
          grep -n "java.version" pom.xml

          echo "==== Compiler Plugin ===="
          grep -A 5 -B 2 "<artifactId>maven-compiler-plugin</artifactId>" pom.xml

      - name: Verify Runtime
        run: |
          java -version
          mvn -version

      - name: Maven Compile Validation
        run: |
          mvn clean compile -DskipTests

      - name: Maven Test Validation
        run: |
          mvn test

      - name: Commit Java 17 Upgrade
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add pom.xml

          git commit -m "Upgrade Java version from 11 to 17" || true

      - name: Push Changes
        run: |
          git push origin HEAD

      - name: Create Migration Audit
        run: |
          cat > security-governance/outputs/migration-audit.json << EOF
          {
            "status":"approved",
            "migration":"java11-to-java17",
            "java_runtime":"17",
            "compiler_target":"17",
            "build_status":"passed",
            "timestamp":"$(date)"
          }
          EOF

      - name: Upload Migration Audit
        uses: actions/upload-artifact@v4
        with:
          name: migration-audit
          path: security-governance/outputs/